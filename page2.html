  <nav class="nav">

  <div class="card">

    <div class="card__header">
      <div class="card__date">
        <span class="card__date-line">March</span>
        <span class="card__date-line">20th 2026</span>
      </div>
      <div class="card__divider-v"></div>
      <div class="card__word">Stillness</div>
    </div>

    <div class="card__divider-h"></div>

    <div class="card__body">
      <p class="card__text">
        some things grow best<br>
        when left alone.<br>
        silence is not empty —<br>
        it is full<br>
        of answers.
      </p>
